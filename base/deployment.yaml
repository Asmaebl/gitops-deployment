apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-application
  labels:
    app: gitops-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-application
  template:
    metadata:
      labels:
        app: gitops-application
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gitops-application
          image: ghcr.io/asmaebl/gitops-application:cb91da2ab76304a306be5ad23e92631e228f5a6d
          ports:
            - containerPort: 3000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
