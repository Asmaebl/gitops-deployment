apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:Asmaebl/gitops-deployment.git
    targetRevision: main
    path: base

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
